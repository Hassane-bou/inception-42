
services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:v1
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:v1
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception
  
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:v1
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress-data:/var/www/html:ro
    networks:
      - inception

volumes:
  mariadb-data:
    name: mariadb-data
    driver: local
  wordpress-data:
    name: wordpress-data
    driver: local
networks:
  inception:
    name: inception
    driver: bridge