
services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:v1
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:v1
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception
  
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:v1
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - adminer
      - static
    volumes:
      - wordpress-data:/var/www/html:ro
    networks:
      - inception
    
  redis:
    build:
      context: ./requirements/bonus/Redis
    image: redis:v1
    container_name: redis
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build:
      context: ./requirements/bonus/Adminer
    image: adminer:v1
    container_name: adminer
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
  
  static:
    build:
      context: ./requirements/bonus/static
    image: static:v1
    container_name: static
    restart: unless-stopped
    networks:
      - inception
  
  ftp:
    build:
      context: ./requirements/bonus/FTP
    image: ftp:v1
    container_name: ftp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "21:21"
      - "40000-40010:40000-40010"
    depends_on:
      - wordpress
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception


volumes:
  mariadb-data:
    name: mariadb-data
    driver: local
  wordpress-data:
    name: wordpress-data
    driver: local
networks:
  inception:
    name: inception
    driver: bridge